<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Msafiri App Mockups</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  }

  .iphone {
    position: relative;
    width: 393px;
    height: 852px;
    background: #1c1c1e;
    border-radius: 54px;
    box-shadow:
      0 0 0 1px #3a3a3c,
      0 0 0 2px #1c1c1e,
      0 0 0 3px #3a3a3c,
      0 40px 120px rgba(0,0,0,0.8),
      inset 0 0 0 1px rgba(255,255,255,0.08);
    overflow: hidden;
    flex-shrink: 0;
  }

  /* Side buttons */
  .iphone::before {
    content: '';
    position: absolute;
    left: -3px;
    top: 130px;
    width: 3px;
    height: 36px;
    background: #3a3a3c;
    border-radius: 3px 0 0 3px;
    box-shadow: 0 54px 0 #3a3a3c, 0 108px 0 #3a3a3c;
  }
  .iphone::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 180px;
    width: 3px;
    height: 80px;
    background: #3a3a3c;
    border-radius: 0 3px 3px 0;
  }

  .screen {
    position: absolute;
    inset: 12px;
    border-radius: 44px;
    overflow: hidden;
    background: #fff;
  }

  .screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
  }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="iphone" id="frame">
  <div class="screen">
    <img id="shot" src="" alt="App screenshot">
  </div>
  <div class="dynamic-island"></div>
</div>
<script>
  const shots = {
    nav:             '/images/shot-nav.jpg',
    'route-incidents': '/images/shot-route-incidents.jpg',
    map:             '/images/shot-map.jpg',
    browse:          '/images/shot-browse.jpg',
    fines:           '/images/shot-fines.jpg',
    settings:        '/images/shot-settings.jpg',
    report:          '/images/shot-report.jpg',
  };
  const p = new URLSearchParams(location.search).get('s') || 'nav';
  document.getElementById('shot').src = shots[p] || shots.nav;
</script>
</body>
</html>

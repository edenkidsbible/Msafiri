openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin-auth
    description: Admin authentication
  - name: admin-reports
    description: Admin report management
  - name: admin-users
    description: Admin user management
  - name: admin-stats
    description: Admin statistics
  - name: admin-audit
    description: Admin audit logs
  - name: admin-notifications
    description: Admin notifications
  - name: admin-subscribers
    description: Admin subscriber management
  - name: push
    description: Device push token registration
  - name: admin-push
    description: Admin push notification campaigns
  - name: speed-zones
    description: Public speed zone lookup
  - name: admin-speed-zones
    description: Admin speed zone management
  - name: blog
    description: Public blog posts
  - name: admin-blog
    description: Admin blog management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Invalid credentials

  /admin/auth/change-password:
    post:
      operationId: adminChangePassword
      tags: [admin-auth]
      summary: Change the current admin user's password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "400":
          description: Invalid input
        "401":
          description: Invalid current password or unauthorized

  /admin/auth/me:
    get:
      operationId: adminGetMe
      tags: [admin-auth]
      summary: Get the current admin user, with freshly-resolved effective permissions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          description: Unauthorized

  /admin/reports:
    get:
      operationId: adminListReports
      tags: [admin-reports]
      summary: List all reports (paginated)
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Reports list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportList"
        "401":
          description: Unauthorized
    post:
      operationId: adminCreateReport
      tags: [admin-reports]
      summary: Create a report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReport"
        "401":
          description: Unauthorized

  /admin/reports/export:
    get:
      operationId: adminExportReports
      tags: [admin-reports]
      summary: Export reports as CSV
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Unauthorized

  /admin/reports/import:
    post:
      operationId: adminImportReports
      tags: [admin-reports]
      summary: Import reports from a CSV file (create new, restore/update existing by id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReportImportInput"
      responses:
        "200":
          description: Import result summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportImportResult"
        "400":
          description: Invalid CSV
        "401":
          description: Unauthorized

  /admin/reports/bulk:
    post:
      operationId: adminBulkReports
      tags: [admin-reports]
      summary: Bulk action on reports (confirm, deny, delete)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBulkReportInput"
      responses:
        "200":
          description: Bulk action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBulkReportResult"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /admin/reports/moderation-queue:
    get:
      operationId: adminGetModerationQueue
      tags: [admin-reports]
      summary: List reports awaiting moderation (recently expired, pending review)
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModerationQueue"
        "401":
          description: Unauthorized

  /admin/reports/{id}/approve:
    post:
      operationId: adminApproveReport
      tags: [admin-reports]
      summary: Approve a queued report (restore an expired report or publish a pending-review submission)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModerationActionResult"
        "400":
          description: Report is not in a queued state
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/reports/{id}/reject:
    post:
      operationId: adminRejectReport
      tags: [admin-reports]
      summary: Reject a queued report (deny a pending-review submission, or dismiss an expired one from the queue)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModerationActionResult"
        "400":
          description: Report is not in a queued state
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/search:
    get:
      operationId: adminGlobalSearch
      tags: [admin-search]
      summary: Search reports, creator applications, subscribers, and team members in one query
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Grouped search results (sections a role can't view come back empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSearchResult"
        "401":
          description: Unauthorized

  /admin/reports/{id}:
    patch:
      operationId: adminUpdateReport
      tags: [admin-reports]
      summary: Update a report
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReportUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReport"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: adminDeleteReport
      tags: [admin-reports]
      summary: Delete a report
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin-users]
      summary: List admin users
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (staff cannot access)
    post:
      operationId: adminCreateUser
      tags: [admin-users]
      summary: Create an admin/moderator/staff user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      tags: [admin-users]
      summary: Update an admin user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: adminDeleteUser
      tags: [admin-users]
      summary: Delete an admin user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin-stats]
      summary: Dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized

  /admin/audit-logs:
    get:
      operationId: adminListAuditLogs
      tags: [admin-audit]
      summary: List audit logs
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: since
          schema: { type: string }
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"
        "401":
          description: Unauthorized

  /admin/notifications:
    get:
      operationId: adminListNotifications
      tags: [admin-notifications]
      summary: List notifications
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotificationList"
        "401":
          description: Unauthorized

  /admin/notifications/read-all:
    patch:
      operationId: adminMarkAllNotificationsRead
      tags: [admin-notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Unauthorized

  /admin/notifications/{id}/read:
    patch:
      operationId: adminMarkNotificationRead
      tags: [admin-notifications]
      summary: Mark a notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Unauthorized

  /admin/notifications/{id}:
    delete:
      operationId: adminDeleteNotification
      tags: [admin-notifications]
      summary: Delete a notification
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Unauthorized

  /admin/subscribers:
    get:
      operationId: adminListSubscribers
      tags: [admin-subscribers]
      summary: List RevenueCat subscribers
      responses:
        "200":
          description: Subscriber list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubscriberList"
        "401":
          description: Unauthorized

  /speed-zones:
    get:
      operationId: listSpeedZones
      tags: [speed-zones]
      summary: List active speed zones near a point
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number }
        - in: query
          name: lng
          required: true
          schema: { type: number }
        - in: query
          name: radius
          schema: { type: number }
      responses:
        "200":
          description: Speed zones near the point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeedZonePublicList"
        "400":
          description: Missing lat/lng

  /admin/speed-zones:
    get:
      operationId: adminListSpeedZones
      tags: [admin-speed-zones]
      summary: List all speed zones (paginated)
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: mode
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Speed zones list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSpeedZoneList"
        "401":
          description: Unauthorized
    post:
      operationId: adminCreateSpeedZone
      tags: [admin-speed-zones]
      summary: Create a speed zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeedZoneInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSpeedZone"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /admin/speed-zones/{id}:
    patch:
      operationId: adminUpdateSpeedZone
      tags: [admin-speed-zones]
      summary: Update a speed zone
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeedZoneUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSpeedZone"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: adminDeleteSpeedZone
      tags: [admin-speed-zones]
      summary: Delete a speed zone
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /app/version:
    get:
      operationId: getAppVersion
      tags: [health]
      summary: Get current app version info and force-update status
      parameters:
        - in: query
          name: platform
          schema: { type: string }
        - in: query
          name: version
          schema: { type: string }
        - in: query
          name: build
          schema: { type: integer }
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppVersionInfo"

  /admin/releases:
    get:
      operationId: adminListReleases
      tags: [admin-push]
      summary: List all app releases
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Release list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppReleaseList"
        "401":
          description: Unauthorized
    post:
      operationId: adminCreateRelease
      tags: [admin-push]
      summary: Create a new draft release
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppReleaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRelease"
        "401":
          description: Unauthorized

  /admin/releases/{id}:
    patch:
      operationId: adminUpdateRelease
      tags: [admin-push]
      summary: Update a draft release
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppReleaseInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"
        "401":
          description: Unauthorized
    delete:
      operationId: adminDeleteRelease
      tags: [admin-push]
      summary: Delete a draft release
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"
        "401":
          description: Unauthorized

  /admin/releases/{id}/publish:
    post:
      operationId: adminPublishRelease
      tags: [admin-push]
      summary: Publish a draft release (draft → live)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"
        "401":
          description: Unauthorized

  /admin/releases/{id}/deprecate:
    post:
      operationId: adminDeprecateRelease
      tags: [admin-push]
      summary: Deprecate a live release
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deprecated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"
        "401":
          description: Unauthorized

  /push/register:
    post:
      operationId: registerPushToken
      tags: [push]
      summary: Register device push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRegisterInput"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /push/deregister:
    delete:
      operationId: deregisterPushToken
      tags: [push]
      summary: Remove device push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeregisterPushTokenInput"
      responses:
        "200":
          description: Deregistered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /admin/push/devices:
    get:
      operationId: adminGetPushDeviceStats
      tags: [admin-push]
      summary: Get registered device statistics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Device stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDeviceStats"
        "401":
          description: Unauthorized

  /admin/push/campaigns:
    get:
      operationId: adminListPushCampaigns
      tags: [admin-push]
      summary: List push campaigns
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Campaign list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushCampaignList"
        "401":
          description: Unauthorized
    post:
      operationId: adminCreatePushCampaign
      tags: [admin-push]
      summary: Create and optionally send a push campaign
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushCampaignInput"
      responses:
        "200":
          description: Sent immediately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushCampaign"
        "201":
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushCampaign"
        "401":
          description: Unauthorized

  /admin/push/campaigns/{id}:
    delete:
      operationId: adminDeletePushCampaign
      tags: [admin-push]
      summary: Delete a push campaign
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"
        "401":
          description: Unauthorized

  /blog/posts:
    get:
      operationId: listBlogPosts
      tags: [blog]
      summary: List published blog posts
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Paginated blog post list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostList"

  /blog/posts/{slug}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get a published post by slug (increments read count)
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Full blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostFull"
        "404":
          description: Not found

  /admin/blog/posts:
    get:
      operationId: adminListBlogPosts
      tags: [admin-blog]
      summary: List all blog posts (admin)
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBlogPostList"
    post:
      operationId: adminCreateBlogPost
      tags: [admin-blog]
      summary: Create a blog post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBlogPostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBlogPost"

  /admin/blog/posts/{id}:
    get:
      operationId: adminGetBlogPost
      tags: [admin-blog]
      summary: Get a single post by ID (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBlogPost"
    put:
      operationId: adminUpdateBlogPost
      tags: [admin-blog]
      summary: Update a blog post
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBlogPostInput"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBlogPost"
    delete:
      operationId: adminDeleteBlogPost
      tags: [admin-blog]
      summary: Delete a blog post
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /admin/blog/stats:
    get:
      operationId: adminGetBlogStats
      tags: [admin-blog]
      summary: Blog read stats — total reads, top posts
      responses:
        "200":
          description: Blog statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email:   { type: string }
        password: { type: string }

    AdminLoginResult:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/AdminUser"

    AdminUser:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:                 { type: string }
        email:               { type: string }
        name:                { type: string }
        role:                { type: string }
        createdAt:           { type: string }
        mustChangePassword:  { type: boolean }
        effectivePermissions:
          type: array
          items: { type: string }

    AdminMe:
      type: object
      required: [id, email, name, role, effectivePermissions]
      properties:
        id:                    { type: string }
        email:                 { type: string }
        name:                  { type: string }
        role:                  { type: string }
        mustChangePassword:    { type: boolean }
        effectivePermissions:
          type: array
          items: { type: string }

    AdminChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword:     { type: string, minLength: 8 }

    AdminUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"

    AdminUserInput:
      type: object
      required: [email, name, password, role]
      properties:
        email:    { type: string }
        name:     { type: string }
        password: { type: string }
        role:     { type: string }

    AdminUserUpdate:
      type: object
      properties:
        email:    { type: string }
        name:     { type: string }
        password: { type: string }
        role:     { type: string }

    AdminReport:
      type: object
      required: [id, type, lat, lng, deviceId, status, confirmCount, denyCount, createdAt]
      properties:
        id:           { type: string }
        type:         { type: string }
        lat:          { type: number }
        lng:          { type: number }
        deviceId:     { type: string }
        status:       { type: string }
        confirmCount: { type: integer }
        denyCount:    { type: integer }
        speedLimit:   { type: ["integer", "null"] }
        roadName:     { type: ["string", "null"] }
        createdAt:    { type: string }
        expiresAt:    { type: ["string", "null"] }

    AdminReportList:
      type: object
      required: [reports, total, page, limit]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/AdminReport"
        total:  { type: integer }
        page:   { type: integer }
        limit:  { type: integer }

    AdminReportInput:
      type: object
      required: [type, lat, lng]
      properties:
        type:       { type: string }
        lat:        { type: number }
        lng:        { type: number }
        deviceId:   { type: string }
        status:     { type: string }
        speedLimit: { type: ["integer", "null"] }
        roadName:   { type: ["string", "null"] }

    AdminReportUpdate:
      type: object
      properties:
        type:         { type: string }
        lat:          { type: number }
        lng:          { type: number }
        status:       { type: string }
        speedLimit:   { type: ["integer", "null"] }
        roadName:     { type: ["string", "null"] }
        confirmCount: { type: integer }
        denyCount:    { type: integer }

    AdminBulkReportInput:
      type: object
      required: [action, ids]
      properties:
        action:
          type: string
          enum: [confirm, deny, delete]
        ids:
          type: array
          items: { type: string }

    AdminSearchResult:
      type: object
      required: [reports, creators, subscribers, users]
      properties:
        reports:
          type: array
          items:
            type: object
            required: [id, type, status]
            properties:
              id:       { type: string }
              type:     { type: string }
              roadName: { type: ["string", "null"] }
              status:   { type: string }
              lat:      { type: number }
              lng:      { type: number }
        creators:
          type: array
          items:
            type: object
            required: [id, email, status]
            properties:
              id:     { type: string }
              name:   { type: ["string", "null"] }
              email:  { type: string }
              status: { type: string }
        subscribers:
          type: array
          items:
            type: object
            required: [id, appUserId, hasActiveEntitlement]
            properties:
              id:                   { type: string }
              appUserId:            { type: string }
              hasActiveEntitlement: { type: boolean }
        users:
          type: array
          items:
            type: object
            required: [id, name, email, role]
            properties:
              id:    { type: string }
              name:  { type: string }
              email: { type: string }
              role:  { type: string }

    AdminModerationQueue:
      type: object
      required: [expired, pendingReview]
      properties:
        expired:
          type: array
          items:
            $ref: "#/components/schemas/AdminReport"
        pendingReview:
          type: array
          items:
            $ref: "#/components/schemas/AdminReport"

    AdminModerationActionResult:
      type: object
      required: [id, status]
      properties:
        id:        { type: string }
        type:      { type: string }
        status:    { type: string }
        expiresAt: { type: ["string", "null"] }

    AdminBulkReportResult:
      type: object
      required: [success, affected]
      properties:
        success:  { type: boolean }
        affected: { type: integer }

    AdminReportImportInput:
      type: object
      required: [csv]
      properties:
        csv: { type: string }

    AdminReportImportResult:
      type: object
      required: [success, created, updated, skipped, errors]
      properties:
        success: { type: boolean }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items:
            $ref: "#/components/schemas/AdminReportImportError"

    AdminReportImportError:
      type: object
      required: [row, message]
      properties:
        row:     { type: integer }
        message: { type: string }

    AdminStats:
      type: object
      required: [totalReports, activeReports, expiredReports, reportsToday, byType, byStatus, reportsByDay]
      properties:
        totalReports:   { type: integer }
        activeReports:  { type: integer }
        expiredReports: { type: integer }
        reportsToday:   { type: integer }
        byType:
          type: array
          items:
            $ref: "#/components/schemas/StatCount"
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatCount"
        reportsByDay:
          type: array
          items:
            $ref: "#/components/schemas/DayCount"

    StatCount:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }

    DayCount:
      type: object
      required: [date, count]
      properties:
        date:  { type: string }
        count: { type: integer }

    DeleteResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    AuditLog:
      type: object
      required: [id, actorId, actorName, actorRole, action, createdAt]
      properties:
        id:         { type: string }
        actorId:    { type: string }
        actorName:  { type: string }
        actorRole:  { type: string }
        action:     { type: string }
        targetType: { type: ["string", "null"] }
        targetId:   { type: ["string", "null"] }
        details:    {}
        createdAt:  { type: string }

    AuditLogList:
      type: object
      required: [logs, total, page, limit]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total: { type: integer }
        page:  { type: integer }
        limit: { type: integer }

    AdminNotification:
      type: object
      required: [id, title, message, type, isRead, createdAt]
      properties:
        id:        { type: string }
        title:     { type: string }
        message:   { type: string }
        type:      { type: string }
        isRead:    { type: boolean }
        createdAt: { type: string }

    AdminNotificationList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/AdminNotification"
        unreadCount: { type: integer }

    AdminSubscriber:
      type: object
      required: [id, appUserId, hasActiveEntitlement]
      properties:
        id:                   { type: string }
        appUserId:            { type: string }
        lastSeenAt:           { type: ["string", "null"] }
        country:              { type: ["string", "null"] }
        hasActiveEntitlement: { type: boolean }

    AdminSubscriberList:
      type: object
      required: [subscribers, total, activeSubscribers, trialSubscribers]
      properties:
        subscribers:
          type: array
          items:
            $ref: "#/components/schemas/AdminSubscriber"
        total:               { type: integer }
        activeSubscribers:   { type: integer }
        trialSubscribers:    { type: integer }
        projectName:         { type: ["string", "null"] }

    SpeedZonePublic:
      type: object
      required: [id, name, type, mode, status]
      properties:
        id:          { type: string }
        name:        { type: string }
        road:        { type: ["string", "null"] }
        type:        { type: string }
        mode:        { type: string }
        speedLimit:  { type: ["integer", "null"] }
        description: { type: ["string", "null"] }
        lat:         { type: ["number", "null"] }
        lng:         { type: ["number", "null"] }
        startLat:    { type: ["number", "null"] }
        startLng:    { type: ["number", "null"] }
        endLat:      { type: ["number", "null"] }
        endLng:      { type: ["number", "null"] }
        status:      { type: string }
        createdAt:   { type: integer }

    SpeedZonePublicList:
      type: object
      required: [zones]
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/SpeedZonePublic"

    AdminSpeedZone:
      type: object
      required: [id, name, type, mode, status, createdAt, updatedAt]
      properties:
        id:          { type: string }
        name:        { type: string }
        road:        { type: ["string", "null"] }
        type:        { type: string }
        mode:        { type: string }
        speedLimit:  { type: ["integer", "null"] }
        description: { type: ["string", "null"] }
        lat:         { type: ["number", "null"] }
        lng:         { type: ["number", "null"] }
        startLat:    { type: ["number", "null"] }
        startLng:    { type: ["number", "null"] }
        endLat:      { type: ["number", "null"] }
        endLng:      { type: ["number", "null"] }
        status:      { type: string }
        createdBy:   { type: ["string", "null"] }
        createdAt:   { type: string }
        updatedAt:   { type: string }

    AdminSpeedZoneList:
      type: object
      required: [zones, total, page, limit]
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/AdminSpeedZone"
        total: { type: integer }
        page:  { type: integer }
        limit: { type: integer }

    SpeedZoneInput:
      type: object
      required: [name, type]
      properties:
        name:        { type: string, minLength: 1 }
        road:        { type: ["string", "null"] }
        type:        { type: string }
        mode:        { type: string }
        speedLimit:  { type: ["integer", "null"] }
        description: { type: ["string", "null"] }
        lat:         { type: ["number", "null"] }
        lng:         { type: ["number", "null"] }
        startLat:    { type: ["number", "null"] }
        startLng:    { type: ["number", "null"] }
        endLat:      { type: ["number", "null"] }
        endLng:      { type: ["number", "null"] }

    SpeedZoneUpdate:
      type: object
      properties:
        name:        { type: string, minLength: 1 }
        road:        { type: ["string", "null"] }
        type:        { type: string }
        mode:        { type: string }
        speedLimit:  { type: ["integer", "null"] }
        description: { type: ["string", "null"] }
        lat:         { type: ["number", "null"] }
        lng:         { type: ["number", "null"] }
        startLat:    { type: ["number", "null"] }
        startLng:    { type: ["number", "null"] }
        endLat:      { type: ["number", "null"] }
        endLng:      { type: ["number", "null"] }
        status:      { type: string }

    SuccessResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    PushRegisterInput:
      type: object
      required: [deviceId, token]
      properties:
        deviceId: { type: string }
        token:    { type: string }
        platform: { type: string }

    DeregisterPushTokenInput:
      type: object
      required: [deviceId]
      properties:
        deviceId: { type: string }

    PushDeviceStats:
      type: object
      required: [total, byPlatform]
      properties:
        total:      { type: integer }
        byPlatform:
          type: object
          additionalProperties: { type: integer }

    PushCampaign:
      type: object
      required: [id, title, body, type, status, sentCount, failedCount, createdBy, createdAt]
      properties:
        id:          { type: string }
        title:       { type: string }
        body:        { type: string }
        type:        { type: string }
        status:      { type: string }
        scheduledAt: { type: ["string", "null"] }
        sentAt:      { type: ["string", "null"] }
        sentCount:   { type: integer }
        failedCount: { type: integer }
        createdBy:   { type: string }
        createdAt:   { type: string }

    PushCampaignList:
      type: object
      required: [campaigns]
      properties:
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/PushCampaign"

    AppVersionInfo:
      type: object
      required: [isForceRequired, updateAvailable]
      properties:
        latestVersion:      { type: ["string", "null"] }
        latestBuild:        { type: ["integer", "null"] }
        minRequiredVersion: { type: ["string", "null"] }
        minRequiredBuild:   { type: ["integer", "null"] }
        isForceRequired:    { type: boolean }
        updateAvailable:    { type: boolean }
        releaseNotes:       { type: ["string", "null"] }
        storeUrlIos:        { type: ["string", "null"] }
        storeUrlAndroid:    { type: ["string", "null"] }

    AppRelease:
      type: object
      required: [id, version, buildNumber, platform, releaseType, status, isForceUpdate, createdBy, createdAt]
      properties:
        id:             { type: string }
        version:        { type: string }
        buildNumber:    { type: integer }
        platform:       { type: string }
        releaseType:    { type: string }
        releaseNotes:   { type: ["string", "null"] }
        status:         { type: string }
        isForceUpdate:  { type: boolean }
        storeUrlIos:    { type: ["string", "null"] }
        storeUrlAndroid: { type: ["string", "null"] }
        createdBy:      { type: string }
        createdAt:      { type: string }
        publishedAt:    { type: ["string", "null"] }

    AppReleaseList:
      type: object
      required: [releases]
      properties:
        releases:
          type: array
          items:
            $ref: "#/components/schemas/AppRelease"

    AppReleaseInput:
      type: object
      required: [version]
      properties:
        version:         { type: string }
        buildNumber:     { type: integer }
        platform:        { type: string }
        releaseType:     { type: string }
        releaseNotes:    { type: ["string", "null"] }
        isForceUpdate:   { type: boolean }
        storeUrlIos:     { type: ["string", "null"] }
        storeUrlAndroid: { type: ["string", "null"] }

    PushCampaignInput:
      type: object
      required: [title, body]
      properties:
        title:       { type: string }
        body:        { type: string }
        scheduledAt: { type: string }
        data:
          type: object
          additionalProperties: {}

    BlogPostSummary:
      type: object
      required: [id, slug, title, author, readCount, createdAt]
      properties:
        id:           { type: string }
        slug:         { type: string }
        title:        { type: string }
        excerpt:      { type: ["string", "null"] }
        author:       { type: string }
        featuredImage: { type: ["string", "null"] }
        keywords:
          type: array
          items: { type: string }
        readCount:    { type: integer }
        publishedAt:  { type: ["string", "null"] }
        createdAt:    { type: string }

    BlogPostFull:
      type: object
      required: [id, slug, title, content, author, status, readCount, createdAt, updatedAt]
      properties:
        id:              { type: string }
        slug:            { type: string }
        title:           { type: string }
        excerpt:         { type: ["string", "null"] }
        content:         { type: string }
        author:          { type: string }
        status:          { type: string }
        featuredImage:   { type: ["string", "null"] }
        metaTitle:       { type: ["string", "null"] }
        metaDescription: { type: ["string", "null"] }
        keywords:
          type: array
          items: { type: string }
        readCount:       { type: integer }
        publishedAt:     { type: ["string", "null"] }
        createdAt:       { type: string }
        updatedAt:       { type: string }

    BlogPostList:
      type: object
      required: [posts, total, page, limit, pages]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/BlogPostSummary"
        total:  { type: integer }
        page:   { type: integer }
        limit:  { type: integer }
        pages:  { type: integer }

    AdminBlogPost:
      allOf:
        - $ref: "#/components/schemas/BlogPostFull"

    AdminBlogPostList:
      type: object
      required: [posts, total, page, limit, pages]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/AdminBlogPost"
        total:  { type: integer }
        page:   { type: integer }
        limit:  { type: integer }
        pages:  { type: integer }

    AdminBlogPostInput:
      type: object
      required: [title]
      properties:
        title:           { type: string }
        slug:            { type: string }
        excerpt:         { type: string }
        content:         { type: string }
        author:          { type: string }
        status:          { type: string }
        featuredImage:   { type: string }
        metaTitle:       { type: string }
        metaDescription: { type: string }
        keywords:
          type: array
          items: { type: string }

    BlogStats:
      type: object
      required: [totalReads, publishedCount, draftCount, topPosts]
      properties:
        totalReads:     { type: integer }
        publishedCount: { type: integer }
        draftCount:     { type: integer }
        topPosts:
          type: array
          items:
            type: object
            properties:
              id:          { type: string }
              slug:        { type: string }
              title:       { type: string }
              status:      { type: string }
              readCount:   { type: integer }
              publishedAt: { type: ["string", "null"] }
